<a class="post-card" href="{{ .RelPermalink }}">
  <span class="post-section">{{ .Section | humanize }}</span>
  <h3>{{ .Title }}</h3>
  <p>{{ with .Summary }}{{ . | plainify | truncate 150 }}{{ else }}{{ .Description }}{{ end }}</p>
  <span class="post-meta">{{ if .Date }}{{ .Date.Format "Jan 2006" }} · {{ end }}{{ .ReadingTime }} min read</span>
</a>
