{{ define "main" }}
<section class="page-hero compact">
  <p class="eyebrow">Archive</p>
  <h1>{{ .Title }}</h1>
  <p>{{ with .Description }}{{ . }}{{ else }}Essays, notes, field reports, and technical references from this section.{{ end }}</p>
</section>

<section class="post-grid section-wrap">
  {{ range .Pages.ByDate.Reverse }}
    {{ partial "post-card.html" . }}
  {{ end }}
</section>
{{ end }}
